<!DOCTYPE html>
<html>
<head>
  <title>Teacher's Day Greeting</title>
  <style>
    /* --- Basic Page Style --- */
    body {
      background-color: #222;       /* dark background */
      color: white;                 /* light text */
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    /* --- Simple Center Card --- */
    .card {
      background-color: #333;       /* slightly lighter box */
      width: 80%;
      max-width: 500px;
      margin: 100px auto;           /* center on page */
      padding: 20px;
      border-radius: 10px;          /* rounded corners */
    }

    h1 {
      color: #ffd700;               /* gold heading */
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .signature {
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Teacher's Day</h1>
    <p>Dear <strong>Dwarika Sir</strong>,</p>
    <p>
      Thank you for your guidance and support.  
      Your teaching inspires us every day.
    </p>
    <p class="signature">— Subhrajeet</p>
  </div>

</body>
</html>
