<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher's Day Greeting</title>
  <style>
    /* Basic Page Setup */
    body {
      background-color: #222;          /* dark background */
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;                   /* center everything */
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Centered Card */
    .card {
      background-color: #333;
      width: 90%;                      /* take most of the screen on mobile */
      max-width: 500px;                /* but limit width on desktop */
      padding: 20px;
      border-radius: 10px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      color: #ffd700;                   /* gold heading */
      margin-bottom: 20px;
      font-size: 2rem;                  /* scales better */
    }

    p {
      font-size: 1.1rem;
      line-height: 1.5;
      margin: 10px 0;
    }

    .signature {
      margin-top: 20px;
      font-style: italic;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Teacher's Day</h1>
    <p>Dear <strong>Dwarika Sir</strong>,</p>
    <p>
      Thank you for your guidance and support.  
      Your teaching inspires us every day.
    </p>
    <p class="signature">— Subhrajeet</p>
  </div>

</body>
</html>
